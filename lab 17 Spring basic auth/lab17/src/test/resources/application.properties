spring.application.name=lab17
# Tests use an in-memory H2 database (MySQL mode) instead of the Aiven server
spring.datasource.url=jdbc:h2:mem:lab17;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
